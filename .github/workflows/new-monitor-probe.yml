# 新しい監視を作るための下調べ（アットホームを間隔を空けて取ったとき認証画面が出ないか、神奈川の地域URL）。手動実行のみ。
# 結果はURLの一覧と件数だけをログに出す。通知・保存はしない。作り終えたら消す。
name: new-monitor-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: アットホームを40秒間隔で取る
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          i=0
          for u in \
            "https://www.athome.co.jp/rent_office/tokyo/list/?sort=33" \
            "https://www.athome.co.jp/rent_store/tokyo/list/?sort=33" \
            "https://www.athome.co.jp/rent_souko/tokyo/list/?sort=33" \
            "https://www.athome.co.jp/rent_office/tokyo/list/page2/?sort=33" \
            "https://www.athome.co.jp/rent_office/kanagawa/list/?sort=33" \
            "https://www.athome.co.jp/rent_store/kanagawa/list/?sort=33" \
            "https://www.athome.co.jp/rent_souko/kanagawa/list/?sort=33" \
            "https://www.athome.co.jp/rent_store/tokyo/list/page2/?sort=33" ; do
            i=$((i+1))
            code=$(curl -s -L -A "$UA" -H "Accept-Language: ja" -o p$i.html -w "%{http_code}" "$u")
            n=$(grep -o -E 'href="[^"]*/rent_[a-z]+/[0-9]{6,}/' p$i.html | sort -u | wc -l)
            ch=$(grep -c "認証にご協力" p$i.html || true)
            echo "$(date +%T) #$i URL=$u HTTP=$code 物件=$n 認証=$ch"
            if [ "$ch" != "0" ]; then echo "認証画面が出たので止める"; break; fi
            sleep 40
          done
          echo "== 神奈川の地域リンク"
          grep -h -o -E 'href="[^"]*/rent_(office|store|souko)/kanagawa/[a-z0-9-]+/list/"' p5.html p6.html p7.html 2>/dev/null | sort -u | head -60
          echo "== 東京の地域リンク"
          grep -h -o -E 'href="[^"]*/rent_office/tokyo/[a-z0-9-]+/list/"' p1.html 2>/dev/null | sort -u | head -80
