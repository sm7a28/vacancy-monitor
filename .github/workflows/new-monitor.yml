# 新しい監視（SUUMO・アットホームの新着と、HOMES の建物ページ）。1日4回。
# 試運転中は Discord に送らず、結果は new-monitor/results/ に暗号化して残す（NM_NOTIFY を 1 にすると送る）。
# 既読の記録は GitHub Actions のキャッシュに置く（暗号化済み）。ログには件数だけを出す。
name: new-monitor

on:
  # 定時の起動は Cloudflare の Worker nm-dashboard の Cron（JST 8:05/12:05/15:05/18:05）から行う。
  # GitHub の定時実行は混むと大きく遅れる・抜けるため使わない（2026-11-19）
  workflow_dispatch:

concurrency:
  group: new-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 既読の記録を戻す
        uses: actions/cache/restore@v4
        with:
          path: new-monitor/state
          key: nm-state-${{ github.run_id }}
          restore-keys: nm-state-

      - name: 巡回
        env:
          NM_KEY: ${{ secrets.NM_KEY }}
          NM_HOMES_URL: ${{ secrets.NM_HOMES_URL }}
          NM_HOMES_TOKEN: ${{ secrets.NM_HOMES_TOKEN }}
          NM_DASH_URL: ${{ secrets.NM_DASH_URL }}
          NM_DASH_TOKEN: ${{ secrets.NM_DASH_TOKEN }}
          NM_NOTIFY: '0'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node new-monitor/run.js

      - name: 既読の記録を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: new-monitor/state
          key: nm-state-${{ github.run_id }}

      - name: 結果をリポジトリに残す
        if: always()
        run: |
          git config user.name "new-monitor"
          git config user.email "new-monitor@users.noreply.github.com"
          git add new-monitor/results
          if git diff --cached --quiet; then echo "結果の変更なし"; exit 0; fi
          git commit -m "新しい監視の結果（暗号化）"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
