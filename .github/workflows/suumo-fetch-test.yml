# SUUMO の賃貸の検索一覧ページをクラウド（GitHub Actions）から取得できるかを1回だけ確かめるテスト。
# 通知・API・秘密情報は使わない。結果はこのワークフローのログにだけ出る。手動実行のみ。
# 条件：千代田区・中央区・港区、家賃20万円以下、「事務所利用可」(tc=0401104)。
name: suumo-fetch-test

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 一覧ページを取得
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          B="https://suumo.jp/jj/chintai/ichiran/FR301FC001/?ar=030&bs=040&ta=13&cb=0.0&ct=20.0&et=9999999&cn=9999999&mb=0&mt=9999999&shkr1=03&shkr2=03&shkr3=03&shkr4=03&tc=0401104&fw2="
          for q in "&sc=13101&sc=13102&sc=13103" "&sc=13113" "&sc=13104"; do
            u="$B$q"
            code=$(curl -s -L -A "$UA" -H "Accept-Language: ja" -o page.html -w "%{http_code}" "$u")
            title=$(grep -o -E "<title>[^<]*</title>" page.html | head -1)
            links=$(grep -o -E 'href="/chintai/(jnc|bc)_[0-9]+/' page.html | sort -u | wc -l)
            hit=$(grep -o -E 'paginate_set-hit">[^<]*' page.html | head -1)
            challenge=$(grep -c -i -E "captcha|認証にご協力|verify|アクセスが集中" page.html || true)
            echo "URL=$u"
            echo "  HTTP=$code SIZE=$(wc -c < page.html) 物件リンク=$links 件数=$hit 認証画面の語=$challenge"
            echo "  $title"
            sleep 10
          done
